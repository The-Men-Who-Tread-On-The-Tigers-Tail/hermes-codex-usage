name: test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --extra test pytest -m 'not live_codex' -q
      - run: uv run python -m py_compile dashboard/*.py tests/*.py
      - run: node --check desktop/plugin.js
      - run: hermes plugins validate .
