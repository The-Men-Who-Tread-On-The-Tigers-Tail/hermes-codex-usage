name: test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0, Node 24
        with:
          enable-cache: true
      - run: uv run --extra test pytest -m 'not live_codex' -q
      - run: uv run python -m py_compile dashboard/*.py tests/*.py
      - run: node --check desktop/plugin.js
      - run: sh -n install.sh uninstall.sh
      - run: test -f __init__.py && test -f dashboard/manifest.json && test -f desktop/plugin.js
      - run: uv run python tests/validate_plugin.py
