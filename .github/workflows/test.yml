name: test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - run: uv run --extra test pytest -m 'not live_codex' -q
      - run: uv run python -m py_compile dashboard/*.py tests/*.py
      - run: node --check desktop/plugin.js
      - run: sh -n install.sh uninstall.sh
      - run: test -f __init__.py && test -f dashboard/manifest.json && test -f desktop/plugin.js
      - run: uv run python tests/validate_plugin.py
